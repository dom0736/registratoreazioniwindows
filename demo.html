<!doctype html>
<html lang="it" data-tema="scuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · Registratore Azioni 2.1</title>
<style>
:root,:root[data-tema=scuro]{color-scheme:dark;--fg:#f4f7fb;--mut:#a9b8cf;--card:rgba(255,255,255,.07);--cb:rgba(255,255,255,.13);--v:rgba(255,255,255,.11);--vh:rgba(255,255,255,.2);--campo:#1c2636;--a1:#3d6fff;--a2:#c13af2;--bg:linear-gradient(160deg,#18212e,#223044 55%,#2c3b52);--g1:rgba(14,70,254,.5);--g2:rgba(127,66,247,.32);--sh:0 10px 30px rgba(0,0,0,.25)}
:root[data-tema=chiaro]{color-scheme:light;--fg:#1b2740;--mut:#5b6b88;--card:rgba(255,255,255,.72);--cb:rgba(255,255,255,.95);--v:rgba(49,65,84,.1);--vh:rgba(49,65,84,.2);--campo:#fff;--a1:#1f55ff;--a2:#b02fe0;--bg:linear-gradient(160deg,#f5f7fb,#e6ebf6 55%,#d4daf2);--g1:rgba(31,85,255,.16);--g2:rgba(127,66,247,.22);--sh:0 10px 30px rgba(40,50,90,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.55 "Segoe UI",system-ui,sans-serif;background:radial-gradient(60% 50% at 0 100%,var(--g1),transparent 70%),radial-gradient(55% 45% at 100% 0,var(--g2),transparent 70%),var(--bg);background-attachment:fixed}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:26px 18px 60px}
.top,.cap{padding:16px 18px;border-radius:24px;background:var(--card);border:1px solid var(--cb);box-shadow:var(--sh);backdrop-filter:blur(10px)}
.top{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:14px;flex:none;background:linear-gradient(135deg,#3d6fff,#c13af2);position:relative}
.logo:after{content:"";position:absolute;inset:16px;border-radius:50%;background:#ff4d5a}
.tit{flex:1;min-width:0}h1{margin:0;font-size:1.4rem;line-height:1.25}#sub{color:var(--mut);font-size:.8rem}
.ib{height:40px;min-width:40px;padding:0 14px;border-radius:99px;border:1px solid var(--cb);background:var(--v);color:var(--fg);cursor:pointer;font-weight:600;font-size:.85rem;font-family:inherit;text-decoration:none;display:inline-grid;place-items:center}
.ib:hover{background:var(--vh)}
.hint{margin:12px 6px 0;color:var(--mut);font-size:.82rem}
.salti{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.salti a{padding:6px 14px;border-radius:99px;background:var(--v);color:var(--fg);text-decoration:none;font-weight:600;font-size:.82rem;cursor:pointer}
.salti a:hover{background:var(--vh)}.salti a.att{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff}
.desk{min-height:440px;border-radius:24px;padding:22px;display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:var(--sh);background:linear-gradient(135deg,#1e3a8a,#6d28d9 60%,#be185d)}
.ghost{position:absolute;inset:60px 8% 20px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.win{width:min(100%,380px);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);font-size:13px;animation:in .25s;position:relative}
.win.ext{width:min(100%,580px);background:#fff;color:#1b2740}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.tb{padding:8px 12px;font-size:12px;display:flex;justify-content:space-between;background:rgba(0,0,0,.2)}
.ext .tb{background:#e9edf6}
.bd{padding:16px 22px 18px}.app{background:var(--bg);color:var(--fg)}
.l{font-size:11px;color:var(--mut)}
.f{background:var(--campo);border:1px solid var(--cb);border-radius:12px;padding:9px 12px;margin:4px 0 12px}
.pl{display:flex;gap:6px;margin:4px 0 12px}.pl i{font-style:normal;flex:1;text-align:center;padding:6px 0;border-radius:99px;background:var(--v)}
.pl i.on,.b.p{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff}
.b{display:block;text-align:center;padding:9px;border-radius:99px;background:var(--v);margin:0 0 8px}.b.p{font-weight:600;padding:12px}
.ft{display:flex;gap:14px;font-size:11px;color:var(--mut);border-top:1px solid var(--cb);padding-top:10px;margin-top:6px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--cb)}.r>span:last-child{background:var(--v);border-radius:99px;padding:4px 12px;font-size:12px}
.li{padding:8px 12px;border-radius:10px;margin-bottom:4px;background:var(--campo)}.li.s{background:var(--a2);color:#fff}.li small{display:block;opacity:.75}
.row{display:flex;gap:8px}.row .b{flex:1}
.bar{width:310px;max-width:100%;border-radius:20px;background:#161f2d;color:#f4f7fb;padding:6px 10px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:in .25s;position:relative;font-size:12px}
.bar>div{display:flex;align-items:center;gap:8px;height:28px}.bar b{flex:1}
.dot{width:12px;height:12px;border-radius:50%;background:#ff4d5a}.dot.o{background:#ffb020}
.c{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.13);display:grid;place-items:center;font-size:11px}
.bar .pn{display:block;height:auto;margin-top:8px;border-top:1px solid #3a4a62;padding-top:6px}.pn p{margin:0;display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.x{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.13);display:inline-grid;place-items:center}
.ext .bd{padding:14px 18px;font-size:13px}.ext h3,.ext h4{margin:0}
.st{display:flex;gap:10px;margin:10px 0}.nn{width:26px;height:26px;border-radius:50%;background:#3d6fff;color:#fff;display:grid;place-items:center;font:600 12px Consolas,monospace;flex:none}
.im{position:relative;margin-top:6px;height:70px;border-radius:8px;background:#dfe5f3;border:1px solid #cfd6e6}
.im u{position:absolute;left:30%;top:28%;width:46px;height:22px;border:3px solid #ef4444;border-radius:6px}
.im em{position:absolute;right:6px;top:6px;font-style:normal;background:#fff;border-radius:6px;padding:0 6px}
.tbr{display:flex;gap:8px;align-items:center;margin-bottom:6px}.tbr h3{flex:1}
.pill{background:#eef1f8;border-radius:99px;padding:3px 10px;font-size:12px}
.bn{background:#fff3cd;border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ext .b.p{display:inline-block;padding:6px 16px;margin:0}
.dg{display:grid;gap:5px;margin-top:8px}.dg span{display:flex;gap:8px;align-items:center}.dg i{width:14px;height:14px;border-radius:50%}
pre{margin:0;font:13px/1.7 Consolas,monospace}mark{background:none;color:inherit}
.sm{background:#0b57d0;color:#fff;padding:18px}.sm a{color:#fff}.sm .b{background:#fff;color:#0b57d0;display:inline-block;padding:6px 18px;margin-top:10px}
.hot{outline:2px solid #ffd54a;outline-offset:2px;animation:p 1.1s infinite;cursor:pointer}
@keyframes p{50%{outline-offset:6px;outline-color:transparent}}
.cap{margin-top:16px;display:grid;grid-template-columns:42px 1fr;gap:6px 12px}
.n{width:34px;height:34px;border-radius:50%;background:var(--a1);color:#fff;display:grid;place-items:center;font:600 .85rem Consolas,monospace}
h2{margin:4px 0 6px;font-size:1.08rem}#cx{margin:0 0 12px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ctl .sp{flex:1}
.bt{border:0;border-radius:99px;padding:9px 18px;font-weight:600;font-size:.88rem;font-family:inherit;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--a1),var(--a2));text-decoration:none}
.bt.g{background:var(--v);color:var(--fg)}.bt:disabled{opacity:.4;cursor:default}
#dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--vh);margin-right:5px}#dots i.on{background:var(--a2)}
.cap a.gl{color:var(--a1);font-size:.85rem;grid-column:2}
:root[data-tema=scuro] .cap a.gl{color:#8fb0ff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="logo"></div>
  <div class="tit"><h1>Demo</h1><div id="sub">Registratore Azioni · versione 2.1 · prova tutto senza registrare niente</div></div>
  <a class="ib" href="guida.html" id="lg">Guida</a>
  <button class="ib" id="bt" type="button" aria-label="Cambia tema">◐</button>
</header>
<p class="hint">Scegli un argomento. Le finestre sono simulate: clicca sull’elemento che lampeggia in giallo (oppure usa Avanti) per vedere cosa succede.</p>
<nav class="salti" id="salti"></nav>
<div class="desk" id="desk"><div id="scena"></div></div>
<section class="cap">
  <div class="n" id="cn"></div>
  <div><h2 id="ct"></h2><p id="cx"></p>
  <div class="ctl"><button class="bt g" id="pr" type="button">‹ Indietro</button><span id="dots"></span><span class="sp"></span><button class="bt" id="nx" type="button">Avanti ›</button></div></div>
  <a class="gl" id="gl" href="guida.html">Leggi questa parte nella guida</a>
</section>
</div>
<script>
const $=s=>document.querySelector(s);
const app=(t,b)=>`<div class="win app"><div class="tb"><span>${t}</span><span>—  ▢  ✕</span></div><div class="bd">${b}</div></div>`;
const ext=(t,b)=>`<div class="win ext"><div class="tb"><span>${t}</span><span>—  ▢  ✕</span></div><div class="bd">${b}</div></div>`;
const pl=(a,on,h)=>`<div class="pl"${h?` data-h="${h}"`:''}>${a.map(x=>`<i${x==on?' class="on"':''}>${x}</i>`).join('')}</div>`;
const rw=(n,c,h)=>`<div class="r"><span>${n}</span><span${h?` data-h="${h}"`:''}>${c}</span></div>`;
const av=t=>app('Registratore Azioni',`<div class="l">Nome del progetto</div><div class="f" data-h="nome">Lezione Packet Tracer</div><div class="l">Qualità</div>${pl(['Minima','Leggera','Normale','Nitida'],'Normale')}<div class="l">Cosa registrare</div><div class="b" data-h="app">${t} ›</div><div class="b p" data-h="avvia">Avvia registrazione</div><div class="b">Apri un progetto</div><div class="ft"><span>Impostazioni</span><span>Guida</span><span>Segnala</span></div>`);
const bar=(n,p,o)=>`<div class="ghost"></div><div class="bar"><div><i class="dot${o?' o':''}"></i><b>${o?'In pausa':'Passo '+n}</b><span class="c" data-h="lista">≡</span><span class="c" data-h="pausa">${o?'▶':'❚❚'}</span><span class="c" data-h="fine">■</span></div>${p||''}</div>`;
const pn=(n)=>`<div class="pn">${n.map((x,i)=>`<p><span>${x}</span><span class="x"${i==1?' data-h="x"':''}>×</span></p>`).join('')}</div>`;
const web=(rimosso)=>ext('Lezione Packet Tracer · index.html',`<div class="tbr"><h3>Lezione Packet Tracer</h3><span class="pill" data-h="trova">Trova testi</span><span class="pill" data-h="stampa">🖨</span></div>${rimosso?`<div class="bn"><span>1 passo eliminato</span><span><u>Annulla</u> <span class="b p" data-h="copia">Salva copia</span></span></div>`:''}<div class="st"><div class="nn">1</div><div style="flex:1"><h4 data-h="tit">Clic su Router0</h4><div class="im"><u></u><em data-h="cest">🗑 ⤢</em></div></div></div><div class="st"><div class="nn">${rimosso?2:3}</div><div style="flex:1"><h4>Scrivo <code>show ip route</code> e premo Invio</h4></div></div>`);
const li=(a,s)=>a.map((x,i)=>`<div class="li${i==s?' s':''}"${i==s?' data-h="sel"':''}>${x[0]}<small>${x[1]}</small></div>`).join('');
const P=[['Lezione Packet Tracer','24 passi · 3,1 MB'],['Backup router','12 passi · 1,4 MB']];
const S={
smart:`<div class="win ext"><div class="sm"><h3>Windows ha protetto il PC</h3><p>SmartScreen ha impedito l’avvio di un’app non riconosciuta.</p><a data-h="ulteriori" href="#" onclick="return false">Ulteriori informazioni</a></div></div>`,
smart2:`<div class="win ext"><div class="sm"><h3>Windows ha protetto il PC</h3><p>App: RegistratoreAzioni.exe<br>Autore: Autore sconosciuto</p><span class="b" data-h="esegui">Esegui comunque</span></div></div>`,
avvio:av('Tutto lo schermo'),avvio2:av('Solo notepad.exe'),
app:app('Cosa registrare',`<div class="l">Scegli un programma aperto</div>${li([['Tutto lo schermo',''],['notepad.exe','Senza titolo - Blocco note'],['chrome.exe','Google Chrome']],1)}<div class="b" style="margin-top:8px">Aggiorna elenco</div><div class="b p" data-h="scegli">Scegli</div>`),
fine:app('Registratore Azioni',`<h3 style="margin:0 0 4px">Registrazione ferma</h3><p class="l">24 passi non ancora salvati</p><div class="b p" data-h="salva">Salva e apri</div><div class="b">Riprendi</div><div class="b">Annulla registrazione</div>`),
rec:bar(3),rec2:bar(3,pn(['3 · Clic su Router0','2 · Doppio clic su Switch1','1 · Tasto Invio'])),rec3:bar(3,'',1),
shot:`<div class="win ext"><div class="tb"><span>Screenshot del passo</span></div><div class="bd"><div class="im" style="height:90px"><u style="left:20%;top:30%"></u><u style="left:55%;top:50%;border-color:#14b8a6;border-style:dashed;width:70px"></u></div><div class="dg" data-h="col"><span><i style="background:#ef4444"></i>Rosso: clic sinistro</span><span><i style="background:#3b82f6"></i>Blu: clic destro</span><span><i style="background:#22c55e"></i>Verde: clic centrale</span><span><i style="background:#d946ef"></i>Viola: doppio clic</span><span><i style="background:#f59e0b"></i>Arancione: trascinamento</span><span><i style="background:#14b8a6"></i>Verde acqua: tastiera</span></div></div></div>`,
web:web(0),web2:web(1),
pop:ext('Salva copia',`<p>Nel prossimo passaggio scegli la cartella che <b>contiene</b> i progetti (non quella del progetto). Il browser se la ricorda.</p><div class="im"><u style="left:10%"></u></div><p style="text-align:right"><span class="b p" data-h="ok">Ho capito</span></p>`),
prog:app('Apri un progetto',`${li(P,0)}<div class="row" style="margin-top:8px"><div class="b" data-h="apri">Apri</div><div class="b" data-h="ripr">Riprendi</div></div><div class="b" data-h="exp">Esporta file unico</div>`),
imp:app('Impostazioni',rw('Cartella dei progetti','Cambia…')+rw('Tema','Scuro · Chiaro','tema')+rw('Nascondi barra','Sì · No')+rw('Compressione','MozJPEG · 30 ›','comp')+rw('Backup da tenere','5 · 10 · 20 · 50')+rw('Backup cancellati','Gestisci ›','bk')+rw('Demo interattiva','Apri ›','demo')),
bk:app('Backup cancellati',`${li([['Lezione Packet Tracer','annullata · 24 passi · 3,1 MB'],['Backup router','salvata come copia · 12 passi']],0)}<div class="row" style="margin-top:8px"><div class="b" data-h="rip">Ripristina</div><div class="b">Apri</div><div class="b" data-h="el">Elimina</div></div>`),
winr:ext('Esegui',`<p>Scrivi il nome di un programma, cartella o documento.</p><div class="f" style="background:#fff;color:#1b2740;border-color:#cfd6e6">%APPDATA%\\RegistratoreAzioni</div><p style="text-align:right"><span class="b p" data-h="okr">OK</span></p>`),
expl:ext('RegistratoreAzioni',`<div class="li" style="color:#1b2740;background:#eef1f8" data-h="cfg">config.json<small>Clic destro › Apri con › Blocco note</small></div><div class="li" style="color:#1b2740;background:#eef1f8">log.txt</div>`),
note:ext('config.json - Blocco note',`<pre>{\n  "tema": "scuro",\n  <mark data-h="riga">"registra_testo_digitato": true,</mark>\n  "tasto_pausa": "f10",\n  "tasto_fine": "f9"\n}</pre>`)
};
const T=[
['come-si-usa','Come si usa',[
['smart','ulteriori','Primo avvio','Windows può mostrare un avviso perché l’exe non è firmato. Premi Ulteriori informazioni.'],
['smart2','esegui','Esegui comunque','Poi Esegui comunque. L’unico exe ufficiale è quello della pagina Releases.'],
['avvio','nome','Dai un nome','Scrivi il nome del progetto, per esempio la lezione che vuoi rivedere.'],
['avvio','avvia','Avvia','Premi Avvia registrazione (o Invio): da qui ogni clic salva uno screenshot.'],
['rec','fine','Durante la registrazione','Resta solo la barretta, trascinabile e invisibile negli screenshot. F10 pausa, F9 fine.'],
['fine','salva','Salva o torna indietro','Con Fine non si salva ancora. Salva e apri crea la pagina HTML; Riprendi continua; Annulla manda tutto nei backup.']]],
['programma','Un solo programma',[
['avvio','app','Cosa registrare','Premi Tutto lo schermo per scegliere un programma già aperto.'],
['app','scegli','Scegli il programma','Seleziona dall’elenco (Aggiorna elenco se l’hai aperto dopo), poi Scegli.'],
['avvio2','avvia','Solo quel programma','Clic e tasti fatti altrove vengono ignorati. Lo screenshot resta a schermo intero.']]],
['barretta','Barretta e colori',[
['rec','lista','Ultimi passi','Il pulsante con le tre righette apre gli ultimi 5 passi, aggiornati in tempo reale.'],
['rec2','x','Elimina al volo','Un clic sbagliato? Premi la × accanto al passo: sparisce con il suo screenshot.'],
['rec3','pausa','Pausa per le password','Prima di scrivere una password premi F10: tutto quello che digiti viene registrato.'],
['shot','col','Colori dei riquadri','Ogni azione ha il suo colore. La tastiera non disegna nessun riquadro.']]],
['pagina-html','Pagina HTML',[
['web','tit','Modifica i testi','Clicca sul titolo o su una descrizione e scrivi. Invio conferma, Esc annulla.'],
['web','cest','Elimina un passo','Il cestino sull’immagine toglie il passo e i numeri si ricalcolano. Annulla rimette tutto a posto.'],
['web2','copia','Salva copia','Crea la cartella nome_modificato accanto all’originale, che non cambia.'],
['pop','ok','Prima volta','Un popup spiega quale cartella scegliere. Il browser se la ricorda (serve Edge o Chrome).'],
['web','trova','Trova testi','Elenca tutto ciò che hai digitato: cerca, copia o clicca per saltare a quel passo.'],
['web','stampa','Stampa e PDF','Anteprima con passi, formato, margini e contenuti a scelta. Poi Salva come PDF dal browser.']]],
['riprendere','Riprendere ed esportare',[
['prog','apri','Apri','Mostra la pagina HTML del progetto scelto.'],
['prog','ripr','Riprendi','Continua a registrare nello stesso progetto, anche un altro giorno: i nuovi passi vanno in fondo.'],
['prog','exp','Esporta file unico','Un solo HTML con le immagini dentro, da mandare come allegato. Parte dal progetto salvato.']]],
['backup','Backup',[
['imp','bk','Gestisci','In Impostazioni, Backup cancellati › Gestisci: qui finisce tutto ciò che annulli.'],
['bk','rip','Ripristina','Rimette il backup tra i progetti, con _2, _3… se il nome esiste già.'],
['bk','el','Elimina','Cancella per sempre. Il primo clic chiede conferma, il secondo elimina.']]],
['impostazioni','Impostazioni',[
['imp','tema','Tema e barra','Scuro o chiaro (vale anche per le pagine HTML). Nascondi barra la esclude dagli screenshot.'],
['imp','comp','Compressione','MozJPEG: immagini più leggere. Per testi piccoli: dimensione 100%, qualità 25–30, 4:4:4.'],
['imp','demo','Demo','Da qui riapri questa demo quando vuoi.']]],
['avanzate','Avanzate',[
['winr','okr','Apri la cartella','Premi Win+R, scrivi %APPDATA%\\RegistratoreAzioni e premi OK (con il programma chiuso).'],
['expl','cfg','config.json','Clic destro su config.json › Apri con › Blocco note.'],
['note','riga','Cambia un valore','Per esempio false al posto di true: le lettere diventano pallini. Salva con Ctrl+S.']]]
];
const AL={colori:['barretta',3],qualita:['impostazioni',1],file:['riprendere',2],'da-sapere':['barretta',2],segnalazioni:['come-si-usa',0]};
let ti=0,si=0;
function draw(){const[id,,st]=T[ti],[sc,h,tt,tx]=st[si];
$('#scena').innerHTML=S[sc];const e=$('#scena [data-h="'+h+'"]');if(e)e.classList.add('hot');
$('#cn').textContent=si+1;$('#ct').textContent=tt;$('#cx').textContent=tx;
$('#dots').innerHTML=st.map((_,i)=>`<i${i==si?' class="on"':''}></i>`).join('');
document.querySelectorAll('#salti a').forEach((a,i)=>a.classList.toggle('att',i==ti));
$('#pr').disabled=!ti&&!si;$('#nx').textContent=ti==T.length-1&&si==st.length-1?'Ricomincia':'Avanti ›';
$('#gl').href='guida.html#'+id;try{history.replaceState(null,'','#'+id+(si?'/'+si:''))}catch(e){}}
function go(t,s){ti=t;si=s||0;draw()}
function nx(){const n=T[ti][2].length;si<n-1?go(ti,si+1):go(ti<T.length-1?ti+1:0,0)}
function pr(){si?go(ti,si-1):ti&&go(ti-1,T[ti-1][2].length-1)}
$('#salti').innerHTML=T.map((t,i)=>`<a data-i="${i}">${t[1]}</a>`).join('');
$('#salti').onclick=e=>{const a=e.target.closest('a');if(a)go(+a.dataset.i)};
$('#scena').onclick=e=>{if(e.target.closest('.hot'))nx()};
$('#nx').onclick=nx;$('#pr').onclick=pr;
document.onkeydown=e=>{if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')pr()};
