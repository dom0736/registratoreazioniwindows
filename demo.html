.ext .bd{padding:14px 18px;font-size:13px}.ext h3,.ext h4{margin:0}
.st{display:flex;gap:10px;margin:10px 0}.nn{width:26px;height:26px;border-radius:50%;background:#3d6fff;color:#fff;display:grid;place-items:center;font:600 12px Consolas,monospace;flex:none}

.tbr{display:flex;gap:8px;align-items:center;margin-bottom:6px}.tbr h3{flex:1}

.app .b{padding:12px;margin:0 0 12px}.app .b.p{padding:16px;margin-bottom:14px}.app .ft{margin-top:22px;padding-top:16px;gap:18px}

.im em{display:flex;gap:6px;align-items:center}.pill{display:inline-flex;align-items:center}#ic .ic b,.ic b{color:#3d6fff}

.ob{position:absolute;right:8px;top:8px;display:flex;gap:8px}.ob i{width:32px;height:32px;border-radius:50%;background:rgba(15,20,32,.8);color:#fff;display:grid;place-items:center}
.sbar{display:flex;align-items:center;gap:10px;margin:16px auto 0;width:max-content;max-width:100%;padding:8px 8px 8px 20px;border-radius:99px;background:#161f2d;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.35)}.sbar .b{display:inline-block;margin:0;padding:9px 18px;background:rgba(255,255,255,.14);color:#fff}.sbar .b.p{background:linear-gradient(90deg,#3d6fff,#c13af2)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}.dlg{width:100%;max-width:430px;border-radius:20px;background:var(--campo);border:1px solid var(--cb);padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.dh{margin-bottom:12px}.dh b{font-size:1.05rem}.fi{display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:99px;background:var(--v);margin-bottom:8px}
.rw{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:12px}.rw>span:nth-child(2){flex:1}.rw small{display:block;color:var(--mut);font-size:11px}

<body>
<div id="pc">
<div id="dk"><div id="ic"></div><div id="gd" class="win ext gd"></div><div id="st"><div id="scena"></div></div></div>
<div id="tk"><span id="sm" style="display:grid"></span><span class="ta"><img src="icon.png" alt="" onerror="this.remove()">Registratore Azioni</span><span class="sp"></span><button id="bt" type="button" aria-label="Cambia tema"></button><span id="ck"></span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const SV={play:'<path d="M6 4l14 8-14 8z" fill="currentColor"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',list:'<path d="M4 6h16M4 12h16M4 18h16"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',redo:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/>',sliders:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',terminal:'<path d="M4 17l6-5-6-5M12 19h8"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="3"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',expand:'<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>',printer:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="7" y="14" width="10" height="7"/>',theme:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>',start:'<g fill="currentColor" stroke="none"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></g>'};
Object.assign(SV,{back:'<path d="M15 6l-6 6 6 6"/>',fwd:'<path d="M9 6l6 6-6 6"/>',reload:'<path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/>',file:'<path d="M6 3h8l4 4v14H6zM14 3v4h4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'});
const sv=(n,z=20)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SV[n]}</svg>`;
const IM='<img src="icon.png" alt="" onerror="this.remove()">';
const app=(t,b)=>`<div class="win app"><div class="tb"><span>${IM}${t}</span><span>—  ▢  ✕</span></div><div class="bd">${b}</div></div>`;
const ext=(t,b)=>`<div class="win ext"><div class="tb"><span>${t}</span><span>—  ▢  ✕</span></div><div class="bd">${b}</div></div>`;
const pl=(a,on,h)=>`<div class="pl"${h?` data-h="${h}"`:''}>${a.map(x=>`<i${x==on?' class="on"':''}>${x}</i>`).join('')}</div>`;
const rw=(n,c,h)=>`<div class="r"><span>${n}</span><span${h?` data-h="${h}"`:''}>${c}</span></div>`;
const av=t=>app('Registratore Azioni',`<div class="l">Nome del progetto</div><div class="f" data-h="nome">Lezione Packet Tracer</div><div class="l">Qualità</div>${pl(['Minima','Leggera','Normale','Nitida'],'Normale')}<div class="l">Cosa registrare</div><div class="b" data-h="app">${t} ›</div><div class="b p" data-h="avvia">Avvia registrazione</div><div class="b">Apri un progetto</div><div class="ft"><span>Impostazioni</span><span>Guida</span><span>Segnala</span></div>`);
const bar=(n,p,o)=>`<div class="ghost"></div><div class="bar"><div><i class="dot${o?' o':''}"></i><b>${o?'In pausa':'Passo '+n}</b><span class="c" data-h="lista">${sv('list',14)}</span><span class="c" data-h="pausa">${sv(o?'play':'pause',13)}</span><span class="c" data-h="fine">${sv('stop',12)}</span></div>${p||''}</div>`;
const pn=(n)=>`<div class="pn">${n.map((x,i)=>`<p><span>${x}</span><span class="x"${i==1?' data-h="x"':''}>×</span></p>`).join('')}</div>`;
const br=b=>`<div class="win ext br"><div class="tb tbs"><span class="tab">${IM}Lezione Packet Tracer<i>×</i></span><span style="flex:1"></span><span>—  ▢  ✕</span></div><div class="ad"><span>${sv('back',16)}${sv('fwd',16)}${sv('reload',16)}</span><span class="url">${sv('file',14)}file:///C:/Progetti/Lezione Packet Tracer/index.html</span></div><div class="pg">${b}</div></div>`;
const stp=(n,d,img,del)=>`<div class="sc"><div class="nn">${n}</div><div class="sb2"><p>${d}</p>${img?`<div class="im2"><u></u><span class="ob"><i>${sv('expand',15)}</i><i${del?' data-h="cest"':''}>${sv('trash',15)}</i></span></div>`:''}</div></div>`;
const dlg=(t,b)=>`<div class="ov"><div class="dlg"><div class="dh"><b>${t}</b></div>${b}</div></div>`;
const web=m=>br(`<div class="hd">${IM}<div class="tt"><h1 data-h="tit">Lezione Packet Tracer</h1><div class="l2">Registratore Azioni 2.1 · ${m==1?2:3} passi</div></div><span class="tl lbl" data-h="trova">${sv('search',16)}Trova testi</span><span class="tl">${sv('theme',18)}</span><span class="tl" data-h="stampa">${sv('printer',18)}</span></div><p class="hn">Clicca sul titolo o su una descrizione per modificarla, o sul cestino di un’immagine per togliere il passo.</p>${stp(1,'Clic su Router0',1)}${m==1?'':stp(2,'Doppio clic su Switch1',1,1)}${stp(m==1?2:3,'Scrivo <code>show ip route</code> e premo Invio',0)}${m==1?`<div class="sbar"><span>1 passo eliminato</span><span class="b">Annulla</span><span class="b p" data-h="copia">Salva copia</span></div>`:''}${m==2?dlg('Trova testi',`<div class="fi">${sv('search',14)}show</div><div class="rw" data-h="riga"><span class="nn">3</span><span><b>show ip route</b><small>10:42 · Packet Tracer</small></span>${sv('copy',16)}</div><div class="rw"><span class="nn">7</span><span><b>show running-config</b><small>10:44 · Packet Tracer</small></span>${sv('copy',16)}</div>`):''}${m==3?dlg('Prima di salvare',`<p style="margin:0 0 14px;color:var(--mut)">Nel passaggio successivo scegli la cartella che <b style="color:var(--fg)">contiene</b> i progetti, non quella del progetto. Il browser se la ricorda.</p><div style="text-align:right"><span class="b p" data-h="ok">Ho capito</span></div>`):''}`);
const li=(a,s)=>a.map((x,i)=>`<div class="li${i==s?' s':''}"${i==s?' data-h="sel"':''}>${x[0]}<small>${x[1]}</small></div>`).join('');
const P=[['Lezione Packet Tracer','24 passi · 3,1 MB'],['Backup router','12 passi · 1,4 MB']];
const S={
smart:`<div class="win ext"><div class="sm"><h3>Windows ha protetto il PC</h3><p>SmartScreen ha impedito l’avvio di un’app non riconosciuta.</p><a data-h="ulteriori" href="#" onclick="return false">Ulteriori informazioni</a></div></div>`,
smart2:`<div class="win ext"><div class="sm"><h3>Windows ha protetto il PC</h3><p>App: RegistratoreAzioni.exe<br>Autore: Autore sconosciuto</p><span class="b" data-h="esegui">Esegui comunque</span></div></div>`,
avvio:av('Tutto lo schermo'),avvio2:av('Solo notepad.exe'),
app:app('Cosa registrare',`<div class="l">Scegli un programma aperto</div>${li([['Tutto lo schermo',''],['notepad.exe','Senza titolo - Blocco note'],['chrome.exe','Google Chrome']],1)}<div class="b" style="margin-top:8px">Aggiorna elenco</div><div class="b p" data-h="scegli">Scegli</div>`),
fine:app('Registratore Azioni',`<h3 style="margin:0 0 4px">Registrazione ferma</h3><p class="l">24 passi non ancora salvati</p><div class="b p" data-h="salva">Salva e apri</div><div class="b">Riprendi</div><div class="b">Annulla registrazione</div>`),
rec:bar(3),rec2:bar(3,pn(['3 · Clic su Router0','2 · Doppio clic su Switch1','1 · Tasto Invio'])),rec3:bar(3,'',1),
shot:`<div class="win ext"><div class="tb"><span>Screenshot del passo</span></div><div class="bd"><div class="im" style="height:90px"><u style="left:20%;top:30%"></u><u style="left:55%;top:50%;border-color:#14b8a6;border-style:dashed;width:70px"></u></div><div class="dg" data-h="col"><span><i style="background:#ef4444"></i>Rosso: clic sinistro</span><span><i style="background:#3b82f6"></i>Blu: clic destro</span><span><i style="background:#22c55e"></i>Verde: clic centrale</span><span><i style="background:#d946ef"></i>Viola: doppio clic</span><span><i style="background:#f59e0b"></i>Arancione: trascinamento</span><span><i style="background:#14b8a6"></i>Verde acqua: tastiera</span></div></div></div>`,
web:web(0),web2:web(1),trova:web(2),pop:web(3),
prog:app('Apri un progetto',`${li(P,0)}<div class="row" style="margin-top:8px"><div class="b" data-h="apri">Apri</div><div class="b" data-h="ripr">Riprendi</div></div><div class="b" data-h="exp">Esporta file unico</div>`),
imp:app('Impostazioni',rw('Cartella dei progetti','Cambia…')+rw('Tema','Scuro · Chiaro','tema')+rw('Nascondi barra','Sì · No')+rw('Compressione','MozJPEG · 30 ›','comp')+rw('Backup da tenere','5 · 10 · 20 · 50')+rw('Backup cancellati','Gestisci ›','bk')+rw('Demo interattiva','Apri ›','demo')),
bk:app('Backup cancellati',`${li([['Lezione Packet Tracer','annullata · 24 passi · 3,1 MB'],['Backup router','salvata come copia · 12 passi']],0)}<div class="row" style="margin-top:8px"><div class="b" data-h="rip">Ripristina</div><div class="b">Apri</div><div class="b" data-h="el">Elimina</div></div>`),
winr:ext('Esegui',`<p>Scrivi il nome di un programma, cartella o documento.</p><div class="f" style="background:#fff;color:#1b2740;border-color:#cfd6e6">%APPDATA%\\RegistratoreAzioni</div><p style="text-align:right"><span class="b p" data-h="okr">OK</span></p>`),
expl:ext('RegistratoreAzioni',`<div class="li" style="color:#1b2740;background:#eef1f8" data-h="cfg">config.json<small>Clic destro › Apri con › Blocco note</small></div><div class="li" style="color:#1b2740;background:#eef1f8">log.txt</div>`),
note:ext('config.json - Blocco note',`<pre>{\n  "tema": "scuro",\n  <mark data-h="riga">"registra_testo_digitato": true,</mark>\n  "tasto_pausa": "f10",\n  "tasto_fine": "f9"\n}</pre>`)
};
const T=[
['come-si-usa','Come si usa',[
['smart','ulteriori','Primo avvio','Windows può mostrare un avviso perché l’exe non è firmato. Premi Ulteriori informazioni.'],
['smart2','esegui','Esegui comunque','Poi Esegui comunque. L’unico exe ufficiale è quello della pagina Releases.'],
['avvio','nome','Dai un nome','Scrivi il nome del progetto, per esempio la lezione che vuoi rivedere.'],
['avvio','avvia','Avvia','Premi Avvia registrazione (o Invio): da qui ogni clic salva uno screenshot.'],
['rec','fine','Durante la registrazione','Resta solo la barretta, trascinabile e invisibile negli screenshot. F10 pausa, F9 fine.'],
['fine','salva','Salva o torna indietro','Con Fine non si salva ancora. Salva e apri crea la pagina HTML; Riprendi continua; Annulla manda tutto nei backup.']]],
['programma','Un solo programma',[
['avvio','app','Cosa registrare','Premi Tutto lo schermo per scegliere un programma già aperto.'],
['app','scegli','Scegli il programma','Seleziona dall’elenco (Aggiorna elenco se l’hai aperto dopo), poi Scegli.'],
['avvio2','avvia','Solo quel programma','Clic e tasti fatti altrove vengono ignorati. Lo screenshot resta a schermo intero.']]],
['barretta','Barretta e colori',[
['rec','lista','Ultimi passi','Il pulsante con le tre righette apre gli ultimi 5 passi, aggiornati in tempo reale.'],
['rec2','x','Elimina al volo','Un clic sbagliato? Premi la × accanto al passo: sparisce con il suo screenshot.'],
['rec3','pausa','Pausa per le password','Prima di scrivere una password premi F10: tutto quello che digiti viene registrato.'],
['shot','col','Colori dei riquadri','Ogni azione ha il suo colore. La tastiera non disegna nessun riquadro.']]],
['pagina-html','Pagina HTML',[
['web','tit','Modifica i testi','È la pagina che si apre nel browser a fine registrazione. Clicca sul titolo o su una descrizione e scrivi: Invio conferma, Esc annulla.'],
['web','cest','Elimina un passo','Il cestino sull’immagine toglie il passo e i numeri si ricalcolano. Il pulsante accanto apre l’immagine ingrandita.'],
['web2','copia','Salva copia','Compare la barra in basso: Annulla rimette a posto i passi, Salva copia crea nome_modificato accanto all’originale, che non cambia.'],
['pop','ok','Prima volta','Un popup spiega quale cartella scegliere. Il browser se la ricorda (serve Edge o Chrome).'],
['web','trova','Trova testi','Il pulsante accanto a tema e stampa apre l’elenco di tutto ciò che hai digitato.'],
['trova','riga','Cerca e salta','Scrivi per cercare, clicca una riga per andare a quel passo. L’icona a destra copia il testo.'],
['web','stampa','Stampa e PDF','Anteprima con passi, formato, margini e contenuti a scelta. Poi Salva come PDF dal browser.']]],
['riprendere','Riprendere ed esportare',[
['prog','apri','Apri','Mostra la pagina HTML del progetto scelto.'],
['prog','ripr','Riprendi','Continua a registrare nello stesso progetto, anche un altro giorno: i nuovi passi vanno in fondo.'],
['prog','exp','Esporta file unico','Un solo HTML con le immagini dentro, da mandare come allegato. Parte dal progetto salvato.']]],
['backup','Backup',[
['imp','bk','Gestisci','In Impostazioni, Backup cancellati › Gestisci: qui finisce tutto ciò che annulli.'],
['bk','rip','Ripristina','Rimette il backup tra i progetti, con _2, _3… se il nome esiste già.'],
['bk','el','Elimina','Cancella per sempre. Il primo clic chiede conferma, il secondo elimina.']]],
['impostazioni','Impostazioni',[
['imp','tema','Tema e barra','Scuro o chiaro (vale anche per le pagine HTML). Nascondi barra la esclude dagli screenshot.'],
['imp','comp','Compressione','MozJPEG: immagini più leggere. Per testi piccoli: dimensione 100%, qualità 25–30, 4:4:4.'],
['imp','demo','Demo','Da qui riapri questa demo quando vuoi.']]],
['avanzate','Avanzate',[
['winr','okr','Apri la cartella','Premi Win+R, scrivi %APPDATA%\\RegistratoreAzioni e premi OK (con il programma chiuso).'],
['expl','cfg','config.json','Clic destro su config.json › Apri con › Blocco note.'],
['note','riga','Cambia un valore','Per esempio false al posto di true: le lettere diventano pallini. Salva con Ctrl+S.']]]
];
const AL={colori:['barretta',3],qualita:['impostazioni',1],file:['riprendere',2],'da-sapere':['barretta',2],segnalazioni:['come-si-usa',0]};
const IC=['play','target','list','globe','redo','archive','sliders','terminal'];
let ti=0,si=0;
const PS={};let Z=5;
const mv=(el,p)=>{el.style.transform=`translate(${p.x}px,${p.y}px)`;el.style.zIndex=p.z};
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.win,.bar');
if(!el||!(e.target.closest('.tb')||(el.classList.contains('bar')&&!e.target.closest('.c,.x'))))return;
const k=el.id=='gd'?'g':'p',p=PS[k]=PS[k]||{x:0,y:0,z:1},r=el.getBoundingClientRect(),D=$('#dk').getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=p.x,oy=p.y,lo=D.top-r.top,hi=Math.max(lo,D.bottom-r.bottom);
p.z=++Z;el.style.zIndex=p.z;
const m=ev=>{p.x=ox+Math.min(Math.max(ev.clientX-sx,D.left+80-r.right),D.right-80-r.left);p.y=oy+Math.min(Math.max(ev.clientY-sy,lo),hi);mv(el,p)},
u=()=>{removeEventListener('pointermove',m);removeEventListener('pointerup',u)};
addEventListener('pointermove',m);addEventListener('pointerup',u);e.preventDefault()});
function draw(){const[id,nm,st]=T[ti],[sc,h]=st[si],last=ti==T.length-1&&si==st.length-1;
$('#scena').innerHTML=S[sc];{const a=$('#scena>.win,#scena>.bar');if(a&&PS.p)mv(a,PS.p)}const e=$('#scena [data-h="'+h+'"]');if(e)e.classList.add('hot');
$('#gd').innerHTML=`<div class="tb"><span>${IM}Guida · ${nm}</span><span>—  ▢  ✕</span></div><div class="bd"><p class="l" style="margin:0">Clicca l’elemento giallo nel programma, oppure usa Avanti.</p><ol>${st.map((x,i)=>`<li data-i="${i}"${i==si?' class="cur"':''}><b>${x[2]}</b>${i==si?`<p>${x[3]}</p>`:''}</li>`).join('')}</ol><div class="row"><span class="b" id="pr">‹ Indietro</span><span class="b p" id="nx">${last?'Ricomincia':'Avanti ›'}</span></div><a href="guida.html#${id}">Apri la guida completa</a></div>`;
document.querySelectorAll('.ic').forEach((a,i)=>a.classList.toggle('att',i==ti));
try{history.replaceState(null,'','#'+id+(si?'/'+si:''))}catch(e){}}
function go(t,s){ti=t;si=s||0;draw()}
function nx(){const n=T[ti][2].length;si<n-1?go(ti,si+1):go(ti<T.length-1?ti+1:0,0)}
function pr(){si?go(ti,si-1):ti&&go(ti-1,T[ti-1][2].length-1)}
$('#ic').innerHTML=T.map((t,i)=>`<div class="ic" data-i="${i}"><b>${sv(IC[i],22)}</b>${t[1]}</div>`).join('');
$('#ic').onclick=e=>{const a=e.target.closest('.ic');if(a)go(+a.dataset.i)};
$('#gd').onclick=e=>{const l=e.target.closest('li');if(l)return go(ti,+l.dataset.i);if(e.target.closest('#nx'))nx();if(e.target.closest('#pr'))pr()};
$('#scena').onclick=e=>{if(e.target.closest('.hot'))nx()};
document.onkeydown=e=>{if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')pr()};
$('#bt').onclick=()=>{const r=document.documentElement,t=r.dataset.tema=='scuro'?'chiaro':'scuro';r.dataset.tema=t;try{localStorage.setItem('guida_tema',t)}catch(e){}};
try{const t=localStorage.getItem('guida_tema');if(t)document.documentElement.dataset.tema=t}catch(e){}
$('#bt').innerHTML=sv('theme',18);$('#sm').innerHTML=sv('start',20);
const clk=()=>$('#ck').textContent=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});clk();setInterval(clk,30000);
(function(){const[a,b]=location.hash.slice(1).split('/');let t=T.findIndex(x=>x[0]==a),s=+b||0;
if(t<0&&AL[a]){t=T.findIndex(x=>x[0]==AL[a][0]);s=AL[a][1]}go(Math.max(t,0),t<0?0:Math.min(s,T[Math.max(t,0)][2].length-1))})();
</script>
</body>
</html>
