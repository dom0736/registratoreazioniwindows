<script>
const $=s=>document.querySelector(s);
const SV={play:'<path d="M6 4l14 8-14 8z" fill="currentColor"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',list:'<path d="M4 6h16M4 12h16M4 18h16"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',redo:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/>',sliders:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',terminal:'<path d="M4 17l6-5-6-5M12 19h8"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="3"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',expand:'<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>',printer:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="7" y="14" width="10" height="7"/>',theme:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>',start:'<g fill="currentColor" stroke="none"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></g>'};

document.body.append(m);m.style.left=Math.max(6,Math.min(r.left,innerWidth-m.offsetWidth-6))+'px';m.style.bottom=(innerHeight-r.top+8)+'px';
const run=t=>{const i=t.closest('.mi');if(!i)return;const f=it[+i.dataset.i][1];cm();f()};
m.onclick=e=>run(e.target);m.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();run(e.target)}};MN=m;const f=m.querySelector('.mi');if(f)f.focus()}

/* clic su una finestra: la porta davanti; trascinando il titolo (o la barretta) si sposta */
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-w]');if(!el)return;const w=gw(el.dataset.w);if(!w)return;
if(WM.act!=w.id||w.min)fc(w.id);
if(e.target.closest('.wc')||w.mx||!(e.target.closest('.tb')||(e.target.closest('.bar')&&!e.target.closest('.c,.x'))))return;
const r=el.getBoundingClientRect(),D=$('#dk').getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=w.x,oy=w.y,lo=D.top-r.top,hi=Math.max(lo,D.bottom-r.bottom);
const m=ev=>{w.x=ox+Math.min(Math.max(ev.clientX-sx,D.left+80-r.right),D.right-80-r.left);w.y=oy+Math.min(Math.max(ev.clientY-sy,lo),hi);pos(w)},
u=()=>{removeEventListener('pointermove',m);removeEventListener('pointerup',u)};
addEventListener('pointermove',m);addEventListener('pointerup',u);e.preventDefault()});

/* ---- guida a passi ---- */
function draw(){const[id,nm,st]=T[ti],[sc,h]=st[si],last=ti==T.length-1&&si==st.length-1;
gdw.title='Guida · '+nm;
$('#gd').innerHTML=`<div class="tb"><span>${IM}Guida · ${nm}</span>${WC(0)}</div><div class="bd"><p class="l" style="margin:0">Clicca l’elemento giallo nel programma, oppure usa Avanti. In basso trovi le app aperte, come su Windows: un clic le porta davanti o le riduce a icona.</p><ol>${st.map((x,i)=>`<li data-i="${i}"${i==si?' class="cur"':''}><b>${x[2]}</b>${i==si?`<p>${x[3]}</p>`:''}</li>`).join('')}</ol><div class="row"><span class="b" id="pr">‹ Indietro</span><span class="b p" id="nx">${last?'Ricomincia':'Avanti ›'}</span></div><a href="guida.html#${id}">Apri la guida completa</a></div>`;
render(sc,h);
document.querySelectorAll('.ic').forEach((a,i)=>a.classList.toggle('att',i==ti));
try{history.replaceState(null,'','#'+id+(si?'/'+si:''))}catch(e){}}
function go(t,s,r){if(r||t!=ti)reset();ti=t;si=s||0;draw()}
function nx(){const n=T[ti][2].length;si<n-1?go(ti,si+1):go(ti<T.length-1?ti+1:0,0)}
function pr(){si?go(ti,si-1):ti&&go(ti-1,T[ti-1][2].length-1)}
$('#ic').innerHTML=T.map((t,i)=>`<div class="ic" data-i="${i}"><b>${sv(IC[i],22)}</b>${t[1]}</div>`).join('');
$('#ic').onclick=e=>{const a=e.target.closest('.ic');if(a)go(+a.dataset.i)};
$('#gd').onclick=e=>{const l=e.target.closest('li');if(l)return go(ti,+l.dataset.i);if(e.target.closest('#nx'))nx();if(e.target.closest('#pr'))pr()};
$('#scena').onclick=e=>{if(e.target.closest('.hot'))nx()};
document.onkeydown=e=>{if(e.key=='Escape')return cm();if(e.target.closest('#apps,.mn2'))return;if(e.key=='ArrowRight')nx();if(e.key=='ArrowLeft')pr()};

if(t<0&&AL[a]){t=T.findIndex(x=>x[0]==AL[a][0]);s=AL[a][1]}const k=Math.max(t,0);ti=k;go(k,t<0?0:Math.min(s,T[k][2].length-1))})();
