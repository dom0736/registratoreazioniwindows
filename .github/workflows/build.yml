name: Build exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Crea l'exe (con icona se c'e' icon.png)
        shell: pwsh
        run: |
          $opts = @("--onefile", "--windowed", "--name", "RegistratoreAzioni", "--collect-submodules", "pynput", "--add-data", "marchio_registratore.txt;.")
          if (Test-Path icon.png) {
            python crea_icona.py icon.png icon.ico
            $opts += @("--icon", "icon.ico", "--add-data", "icon.png;.")
          }
          pyinstaller @opts registratore.py

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: RegistratoreAzioni
          path: dist/RegistratoreAzioni.exe

      # --- FIRMA DIGITALE (per ora non attiva) ---
      # Per attivarla: togli i # e usa i valori del servizio di firma scelto.
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "INCOLLA-ORGANIZATION-ID"
      #     project-slug: "registratoreazioniwindows"
      #     signing-policy-slug: "release-signing"
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist-firmato
      # Se firmi, nella release qui sotto cambia il percorso in dist-firmato/RegistratoreAzioni.exe

      - name: Calcola l'impronta SHA256 (solo con un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/RegistratoreAzioni.exe -Algorithm SHA256).Hash
          "sha=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Pubblica nelle Releases (solo con un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RegistratoreAzioni.exe
          body: |
            Exe non firmato: se Windows mostra SmartScreen scegli *Ulteriori informazioni → Esegui comunque*.

            SHA256: `${{ steps.hash.outputs.sha }}`

      # Tiene in Releases solo l'ultima versione: cancella le release (e i tag) piu' vecchie.
      - name: Rimuovi le release vecchie (solo con un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ultimo = "${{ github.ref_name }}"
          $vecchie = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq ".[].tagName" | Where-Object { $_ -and $_ -ne $ultimo }
          foreach ($t in $vecchie) { gh release delete $t --repo "${{ github.repository }}" --cleanup-tag --yes }
