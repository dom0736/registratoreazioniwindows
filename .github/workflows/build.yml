name: Build exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Crea l'exe (con icona se c'e' icon.png)
        shell: pwsh
        run: |
          $opts = @("--onefile", "--windowed", "--name", "RegistratoreAzioni", "--collect-submodules", "pynput")
          if (Test-Path icon.png) {
            python -c "from PIL import Image; im = Image.open('icon.png').convert('RGBA'); im.save('icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
            $opts += @("--icon", "icon.ico", "--add-data", "icon.png;.")
          }
          pyinstaller @opts registratore.py

      - uses: actions/upload-artifact@v4
        with:
          name: RegistratoreAzioni
          path: dist/RegistratoreAzioni.exe
