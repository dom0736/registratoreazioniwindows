name: Build exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Crea l'exe
        run: pyinstaller --onefile --windowed --name RegistratoreAzioni --collect-submodules pynput registratore.py

      - uses: actions/upload-artifact@v4
        with:
          name: RegistratoreAzioni
          path: dist/RegistratoreAzioni.exe
